# ============================================================
# BAYAN | بیان — پیکربندی ساخت خودکار روی Railway (Nixpacks)
# این فایل کنار BAYAN-railway.zip در ریشهٔ مخزن گیت‌هاب قرار می‌گیرد.
# ============================================================

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_20", "unzip"]

[phases.build]
cmds = [
  "unzip -o BAYAN-railway.zip -d .",
  "cd BAYAN && npm install --include=dev --no-audit --no-fund",
  "cd BAYAN && npx prisma generate",
  "cd BAYAN && npm run build"
]

[start]
cmd = "node BAYAN/railway-start.js"
